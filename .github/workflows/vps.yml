name: Free Linux Machine

on: workflow_dispatch

jobs:
  run-vps:
    runs-on: ubuntu-latest
    steps:
    - name: Direct Download Ngrok
      run: |
        wget -q https://equinox.io
        sudo tar -xzf ngrok-v3-stable-linux-amd64.tgz -C /usr/local/bin
    - name: Authenticate Ngrok
      run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Set Linux Password
      run: |
        sudo echo "root:Password123" | chpasswd
        sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo service ssh restart
    - name: Start Secure Link
      run: |
        ngrok tcp 22 --log=stdout &
        sleep 20
